<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Відновлення паролю</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">

    <div
        style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #333333; text-align: center;">Відновлення доступу</h2>

        <p style="color: #555555; font-size: 16px; line-height: 1.5;">
            Ви отримали цей лист, оскільки був зроблений запит на скидання паролю для вашого акаунту.
            Ваш тимчасовий токен для відновлення:
        </p>

        <div style="text-align: center; margin: 30px 0;">
            <span
                style="display: inline-block; padding: 15px 25px; font-size: 24px; font-weight: bold; color: #ffffff; background-color: #007bff; border-radius: 5px; letter-spacing: 2px;">
                {{ token }}
            </span>
        </div>

        <p style="color: #555555; font-size: 14px; text-align: center;">
            Якщо ви не робили цього запиту, просто проігноруйте цей лист. Токен дійсний протягом 15 хвилин.
        </p>
    </div>

</body>

</html>
