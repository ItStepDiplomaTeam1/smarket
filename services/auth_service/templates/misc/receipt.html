<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smarket: Payment Receipt</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #2e7d32;">Payment Receipt</h2>
        <p>Your payment was successful. Details of your transaction are below:</p>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <tr>
                <td style="padding: 8px 0; font-weight: bold; border-bottom: 1px solid #eee;">Order Reference:</td>
                <td style="padding: 8px 0; text-align: right; border-bottom: 1px solid #eee;">#{{ reference }}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold; border-bottom: 1px solid #eee;">Amount Paid:</td>
                <td style="padding: 8px 0; text-align: right; border-bottom: 1px solid #eee; color: #2e7d32; font-weight: bold;">{{ amount }}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold; border-bottom: 1px solid #eee;">Transaction Date:</td>
                <td style="padding: 8px 0; text-align: right; border-bottom: 1px solid #eee;">{{ date }}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold; border-bottom: 1px solid #eee;">Card:</td>
                <td style="padding: 8px 0; text-align: right; border-bottom: 1px solid #eee;">{{ card_mask }}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold; border-bottom: 1px solid #eee;">Payment ID:</td>
                <td style="padding: 8px 0; text-align: right; border-bottom: 1px solid #eee; font-family: monospace; font-size: 13px;">{{ payment_id }}</td>
            </tr>
        </table>
        <hr style="border: none; border-top: 1px solid #eee; margin: 25px 0;">
        <p style="font-size: 12px; color: #777;">Thank you for shopping with Smarket!</p>
    </div>
</body>
</html>
