<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Smarket: Код підтвердження</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #2e7d32;">Підтвердження Smarket</h2>
        <p>Вітаємо,</p>
        <p>Ваш одноразовий код підтвердження (OTP):</p>
        <div style="font-size: 28px; font-weight: bold; background-color: #f1f8e9; padding: 15px; text-align: center; border-radius: 4px; color: #2e7d32; letter-spacing: 2px;">
            {{ code }}
        </div>
        <p>Цей код є дійсним протягом короткого часу. Не повідомляйте його стороннім особам.</p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 12px; color: #777;">Це автоматичне повідомлення від Smarket. Будь ласка, не відповідайте на нього.</p>
    </div>
</body>
</html>
