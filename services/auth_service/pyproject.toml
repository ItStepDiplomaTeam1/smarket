[project]
name = "auth-service"
version = "1.0.0"
description = "Standalone authentication microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "granian>=2.7.4",
    "loguru>=0.7.3",
    "orjson>=3.10.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
]

[tool.setuptools.packages.find]
include = ["services*"]
