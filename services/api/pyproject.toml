[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "cryptography>=48.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "fastapi-users>=15.0.5",
    "granian>=2.7.4",
    "itsdangerous>=2.2.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.28",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
]

[tool.uv.scripts]
alembic = "alembic"

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*", "database*"]