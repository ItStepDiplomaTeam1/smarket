name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_SERVICES: >-
    services/auth_service
    services/cart_service
    services/email_worker
    services/gateway
    services/product_service
    services/reviews_service
    services/audit_service
  UV_BIN: /root/.local/bin/uv

jobs:
  # ═══════════════════════════════════════════
  #  STAGE 1 — DETECT CHANGED SERVICES
  # ═══════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.changes.outputs.has_python }}
      has_go: ${{ steps.changes.outputs.has_go }}
      has_rust: ${{ steps.changes.outputs.has_rust }}
      has_node: ${{ steps.changes.outputs.has_node }}
      has_docker: ${{ steps.changes.outputs.has_docker }}
      has_ci_changes: ${{ steps.changes.outputs.has_ci_changes }}
      has_deploy_changes: ${{ steps.changes.outputs.has_deploy_changes }}
      services_matrix: ${{ steps.changes.outputs.services_matrix }}
      python_services_matrix: ${{ steps.changes.outputs.python_services_matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="HEAD~1"
          fi

          run_all=false
          if git cat-file -e "${base_sha}^{commit}" 2>/dev/null && git diff --name-only "$base_sha" HEAD > /tmp/smarket-changed-files; then
            echo "Diff base: $base_sha"
          else
            run_all=true
            git ls-files > /tmp/smarket-changed-files
            echo "Diff base is unavailable; running all service checks."
          fi

          echo "Changed files:"
          awk 'NR <= 200 { print "  - " $0 } NR == 201 { print "  - ..."; exit }' /tmp/smarket-changed-files

          changed() {
            local pattern="$1"
            [[ "$run_all" == "true" ]] && return 0
            grep -E "$pattern" /tmp/smarket-changed-files >/dev/null
          }

          docker_services="[]"
          python_services="[]"

          add_docker_service() {
            local name="$1"
            local dockerfile="$2"
            local context="$3"
            if jq -e --arg n "$name" 'any(.[]; .name == $n)' <<< "$docker_services" >/dev/null; then
              return 0
            fi
            docker_services=$(jq -c \
              --arg n "$name" \
              --arg p "services/$name" \
              --arg df "$dockerfile" \
              --arg ctx "$context" \
              '. += [{"name": $n, "path": $p, "dockerfile": $df, "context": $ctx}]' \
              <<< "$docker_services")
          }

          add_python_service() {
            local name="$1"
            python_services=$(jq -c \
              --arg n "$name" \
              --arg p "services/$name" \
              '. += [{"name": $n, "path": $p}]' \
              <<< "$python_services")
          }

          shared_python=false
          if changed '^(libs|packages)/|^(pyproject\.toml|uv\.lock|requirements.*\.txt|\.python-version)$'; then
            shared_python=true
          fi

          root_docker=false
          if changed '^\.dockerignore$'; then
            root_docker=true
          fi

          deploy_infra=false
          if changed '^infra/|^docker-compose\.yml$|^doppler\.yaml$'; then
            deploy_infra=true
          fi

          python_service_changed() {
            local name="$1"
            [[ "$shared_python" == "true" ]] || changed "^services/${name}/"
          }

          if python_service_changed "auth_service"; then
            add_python_service "auth_service"
            add_docker_service "auth_service" "services/auth_service/Dockerfile" "."
          fi

          if python_service_changed "cart_service"; then
            add_python_service "cart_service"
            add_docker_service "cart_service" "services/cart_service/DockerFile" "."
          fi

          if python_service_changed "email_worker"; then
            add_python_service "email_worker"
            add_docker_service "email_worker" "services/email_worker/Dockerfile" "services/email_worker"
          fi

          if python_service_changed "gateway"; then
            add_python_service "gateway"
            add_docker_service "gateway" "services/gateway/Dockerfile" "services/gateway"
          fi

          if python_service_changed "product_service"; then
            add_python_service "product_service"
            add_docker_service "product_service" "services/product_service/DockerFile" "."
          fi

          if python_service_changed "reviews_service"; then
            add_python_service "reviews_service"
            add_docker_service "reviews_service" "services/reviews_service/Dockerfile" "."
          fi

          if python_service_changed "audit_service"; then
            add_python_service "audit_service"
            add_docker_service "audit_service" "services/audit_service/Dockerfile" "."
          fi

          if python_service_changed "zephyros_agent"; then
            add_python_service "zephyros_agent"
            add_docker_service "zephyros_agent" "services/zephyros_agent/Dockerfile" "."
          fi

          if [[ "$root_docker" == "true" ]]; then
            add_docker_service "auth_service" "services/auth_service/Dockerfile" "."
            add_docker_service "cart_service" "services/cart_service/DockerFile" "."
            add_docker_service "product_service" "services/product_service/DockerFile" "."
            add_docker_service "reviews_service" "services/reviews_service/Dockerfile" "."
            add_docker_service "audit_service" "services/audit_service/Dockerfile" "."
            add_docker_service "zephyros_agent" "services/zephyros_agent/Dockerfile" "."
          fi

          has_go=false
          if changed '^services/products_etl/'; then
            has_go=true
            add_docker_service "products_etl" "services/products_etl/Dockerfile" "services/products_etl"
          fi

          has_rust=false
          if changed '^services/search_service/'; then
            has_rust=true
            add_docker_service "search_service" "services/search_service/Dockerfile" "services/search_service"
          fi

          has_node=false
          if changed '^apps/(react/frontend/my-react-app|admin)/'; then
            has_node=true
          fi

          workflow_changed=false
          if changed '^\.github/workflows/|^\.pre-commit-config\.yaml$|^scripts/run_service_tests\.py$'; then
            workflow_changed=true
          fi

          has_python=false
          [[ "$python_services" != "[]" ]] && has_python=true

          has_docker=false
          [[ "$docker_services" != "[]" ]] && has_docker=true

          has_ci_changes=false
          if [[ "$has_python" == "true" || "$has_go" == "true" || "$has_rust" == "true" || "$has_node" == "true" || "$has_docker" == "true" || "$deploy_infra" == "true" || "$workflow_changed" == "true" ]]; then
            has_ci_changes=true
          fi

          has_deploy_changes=false
          if [[ "$has_docker" == "true" || "$deploy_infra" == "true" ]]; then
            has_deploy_changes=true
          fi

          {
            echo "has_python=$has_python"
            echo "has_go=$has_go"
            echo "has_rust=$has_rust"
            echo "has_node=$has_node"
            echo "has_docker=$has_docker"
            echo "has_ci_changes=$has_ci_changes"
            echo "has_deploy_changes=$has_deploy_changes"
            echo "services_matrix=$docker_services"
            echo "python_services_matrix=$python_services"
          } >> "$GITHUB_OUTPUT"

          echo "Python services: $python_services"
          echo "Docker services: $docker_services"
          echo "CI changes: $has_ci_changes"
          echo "Deploy changes: $has_deploy_changes"

  # ═══════════════════════════════════════════
  #  STAGE 2 — SECURITY
  # ═══════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_ci_changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --no-git --verbose --redact \
            --exit-code 1

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
          trivyignores: .trivyignore

  # ═══════════════════════════════════════════
  #  STAGE 3 — LINT & TEST (parallel)
  # ═══════════════════════════════════════════

  # ── Python Quality (один джоб для всіх) ──
  python-quality:
    name: 🔍 Python Quality — ${{ matrix.service.name }}
    needs: detect
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      # ── Кеш uv пакетів на диску сервера ──
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path), format('{0}/requirements.txt', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q ruff mypy

      - name: Ruff — style warnings (PEP8, E/W + non-breaking F rules)
        working-directory: ${{ matrix.service.path }}
        continue-on-error: true
        run: |
          .venv/bin/ruff check . --select E,W,F401,F841 --output-format=github
          .venv/bin/ruff format --check . || true

      - name: Ruff — code errors (F rules that break runtime)
        working-directory: ${{ matrix.service.path }}
        run: |
          .venv/bin/ruff check . --select F --ignore F401,F841 --output-format=github

      - name: mypy type check
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/mypy .
        continue-on-error: true

  # ── Python Tests ──────────────────────────
  python-test:
    name: 🧪 Python Tests — ${{ matrix.service.name }}
    needs: [detect, python-quality]
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path), format('{0}/requirements.txt', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service + test dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          JWT_SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          ETL_ADMIN_KEY: "dummy-etl-admin-key-for-tests-123456"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672//"
          RESEND_API_KEY: "dummy-resend-api-key"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          APP_WORKERS: "1"
          DEBUG: "False"

        run: |
          if find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            .venv/bin/pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short
          else
            echo "::warning title=No Tests::No tests found in ${{ matrix.service.path }}/tests/"
          fi

      - name: Upload coverage
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.xml
          if-no-files-found: ignore

  # ── Node.js / React ───────────────────────
  node-ci:
    name: ⚛️ Node.js — ${{ matrix.app.name }}
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: storefront
            path: apps/react/frontend/my-react-app
          - name: admin
            path: apps/admin
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - uses: actions/checkout@v4

      # ── Кеш node_modules на диску сервера ──
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app.path }}/node_modules
          key: node-modules-${{ matrix.app.name }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app.path)) }}
          restore-keys: node-modules-${{ matrix.app.name }}-

      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical || true
      - name: Contract tests
        run: npm run test:ai --if-present
      - name: Production build
        run: npm run build

  # ── Go / ETL ──────────────────────────────
  go-ci:
    name: 🐹 Go ETL
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/products_etl
    steps:
      - uses: actions/checkout@v4

      # ── Кеш Go модулів на диску сервера ──
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('services/products_etl/go.sum') }}
          restore-keys: go-

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build ./...

  # ── Rust / Search Service ─────────────────
  rust-ci:
    name: 🦀 Rust Search Service
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: services/search_service
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            services/search_service/target
          key: rust-${{ hashFiles('services/search_service/Cargo.lock') }}
          restore-keys: rust-

      - name: Ensure Rustup and Cargo are available
        run: |
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          rustc --version
          cargo --version

      - name: Cargo clippy check
        run: cargo clippy -- -D warnings || cargo clippy

      - name: Run Cargo tests
        run: cargo test --verbose

  # ═══════════════════════════════════════════
  #  STAGE 4 — DOCKER BUILD & PUSH → GHCR
  # ═══════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — ${{ matrix.service.name }}
    needs: [detect, security, python-quality, python-test, node-ci, go-ci, rust-ci]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.detect.outputs.has_docker == 'true' &&
      needs.detect.outputs.services_matrix != '[]' &&
      needs.detect.outputs.services_matrix != '' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services_matrix || '[]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ── Локальний кеш Docker шарів на диску сервера ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/var/tmp/buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/var/tmp/buildx-cache/${{ matrix.service.name }}-new,mode=max

      # ── Ротація кешу (щоб не росло безкінечно) ──
      - name: Rotate Docker cache
        run: |
          rm -rf /var/tmp/buildx-cache/${{ matrix.service.name }}
          mv /var/tmp/buildx-cache/${{ matrix.service.name }}-new \
             /var/tmp/buildx-cache/${{ matrix.service.name }} 2>/dev/null || true

  # ═══════════════════════════════════════════
  #  STAGE 5 — DEPLOY TO HETZNER
  # ═══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Hetzner
    needs: [detect, security, python-quality, python-test, node-ci, go-ci, rust-ci, docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure SSH host verification
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || '157.180.74.21' }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_SSH_PASSPHRASE: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::SSH setup failed at line ${LINENO}."' ERR

          : "${HETZNER_HOST:?HETZNER_HOST secret is required}"
          : "${HETZNER_SSH_KEY:?HETZNER_SSH_KEY secret is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" |
            sed 's/\r$//' > "$HOME/.ssh/hetzner_deploy_key"
          chmod 600 "$HOME/.ssh/hetzner_deploy_key"
          if [[ -z "$HETZNER_SSH_PASSPHRASE" ]] &&
             ! ssh-keygen -y -P "" -f "$HOME/.ssh/hetzner_deploy_key" > /dev/null; then
            echo "::error::HETZNER_SSH_KEY is encrypted. Add the HETZNER_SSH_PASSPHRASE secret or replace it with an unencrypted deploy key."
            exit 1
          fi

          known_hosts_tmp="$RUNNER_TEMP/hetzner_known_hosts"
          if [[ -n "$HETZNER_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$HETZNER_KNOWN_HOSTS" |
              sed 's/\r$//' > "$known_hosts_tmp"
          else
            echo "::warning::HETZNER_KNOWN_HOSTS is not set; trusting the host key returned by the first connection."
            for attempt in 1 2 3; do
              if ssh-keyscan -T 10 -H "$HETZNER_HOST" > "$known_hosts_tmp" 2> /dev/null; then
                break
              fi
              echo "Host-key scan attempt ${attempt}/3 failed."
            done
          fi
          test -s "$known_hosts_tmp"
          install -m 600 "$known_hosts_tmp" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$HETZNER_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Deploy develop over SSH
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || '157.180.74.21' }}
          HETZNER_SSH_PASSPHRASE: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER || 'root' }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::SSH deployment transport failed at line ${LINENO}."' ERR

          : "${DOPPLER_TOKEN:?DOPPLER_TOKEN secret is required}"
          : "${GHCR_TOKEN:?GITHUB_TOKEN is required}"
          : "${HETZNER_HOST:?HETZNER_HOST secret is required}"
          : "${HETZNER_SSH_USER:?HETZNER_SSH_USER must not be empty}"

          ssh_agent_started=false
          askpass_helper=""
          cleanup_ssh() {
            local exit_code=$?
            trap - EXIT
            if [[ "$ssh_agent_started" == true ]]; then
              ssh-agent -k > /dev/null 2>&1 || true
            fi
            if [[ -n "$askpass_helper" ]]; then
              rm -f -- "$askpass_helper"
            fi
            exit "$exit_code"
          }
          trap cleanup_ssh EXIT

          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o PreferredAuthentications=publickey
            -o ServerAliveCountMax=3
            -o ServerAliveInterval=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          if [[ -n "$HETZNER_SSH_PASSPHRASE" ]]; then
            eval "$(ssh-agent -s)" > /dev/null
            ssh_agent_started=true
            askpass_helper="$RUNNER_TEMP/hetzner_ssh_askpass"
            cat > "$askpass_helper" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          printf '%s\n' "$HETZNER_SSH_PASSPHRASE"
          ASKPASS_SCRIPT
            chmod 700 "$askpass_helper"

            if ! DISPLAY=:0 \
              SSH_ASKPASS="$askpass_helper" \
              SSH_ASKPASS_REQUIRE=force \
              ssh-add "$HOME/.ssh/hetzner_deploy_key" < /dev/null; then
              echo "::error::Unable to unlock HETZNER_SSH_KEY with HETZNER_SSH_PASSPHRASE."
              exit 1
            fi
            rm -f -- "$askpass_helper"
            askpass_helper=""
            unset HETZNER_SSH_PASSPHRASE
            ssh_options+=(-o "IdentityAgent=$SSH_AUTH_SOCK")
          else
            ssh_options+=(
              -i "$HOME/.ssh/hetzner_deploy_key"
              -o IdentitiesOnly=yes
            )
          fi

          {
            # Secrets travel only through the encrypted SSH stream, never as
            # command-line arguments or echoed workflow values.
            printf '%s\n' "$DOPPLER_TOKEN"
            printf '%s\n' "$GHCR_TOKEN"
            printf '%s\n' "$GHCR_USER"
            cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_tmp=""
          cleanup() {
            if [[ -n "$deploy_tmp" && -d "$deploy_tmp" ]]; then
              rm -rf -- "$deploy_tmp"
            fi
          }
          report_failure() {
            local exit_code=$?
            echo "::error::Remote deployment failed near line ${BASH_LINENO[0]} (exit ${exit_code})." >&2
            exit "$exit_code"
          }
          trap cleanup EXIT
          trap report_failure ERR

          : "${DOPPLER_TOKEN:?Doppler credential was not received}"
          : "${GHCR_TOKEN:?GHCR credential was not received}"
          : "${GHCR_USER:?GHCR username was not received}"

          readonly app_dir=/app/smarket
          readonly deploy_wait_timeout=360
          readonly min_free_mb=1024
          deploy_tmp="$(mktemp -d /tmp/smarket-deploy.XXXXXX)"

          echo "=== Updating application checkout ==="
          test -d "$app_dir/.git"
          cd "$app_dir"
          git config --global --add safe.directory /app/smarket || true

          # Preserve host-level Compose values while the tracked checkout moves.
          if [[ -f infra/.env ]]; then
            cp infra/.env "$deploy_tmp/infra.env"
          fi
          if [[ -f .env ]]; then
            cp .env "$deploy_tmp/root.env"
          fi

          git checkout develop
          git pull --ff-only origin develop

          if [[ -f "$deploy_tmp/infra.env" ]]; then
            install -m 600 "$deploy_tmp/infra.env" infra/.env
          else
            touch infra/.env
            chmod 600 infra/.env
          fi
          if [[ -f "$deploy_tmp/root.env" ]]; then
            install -m 600 "$deploy_tmp/root.env" .env
          else
            touch .env
            chmod 600 .env
          fi

          echo "=== Synchronizing service secrets from Doppler ==="
          if ! command -v doppler > /dev/null 2>&1; then
            curl -LsS --tlsv1.2 --proto "=https" --retry 3 \
              https://cli.doppler.com/install.sh | sh
          fi
          doppler --version

          declare -A configs=(
            ["services/gateway"]="dev_gateway"
            ["services/auth_service"]="dev_auth_service"
            ["services/product_service"]="dev_product_service"
            ["services/cart_service"]="dev_cart_service"
            ["services/email_worker"]="dev_email_worker"
            ["services/reviews_service"]="dev_reviews_service"
            ["services/products_etl"]="dev_products_etl"
            ["services/search_service"]="dev_search_service"
            ["services/zephyros_agent"]="dev_zephyros_agent"
            ["services/audit_service"]="dev_audit_service"
          )
          for path in "${!configs[@]}"; do
            config="${configs[$path]}"
            env_tmp="$deploy_tmp/${config}.env"
            echo "Downloading Doppler config ${config}."
            doppler secrets download \
              --project smarket-services-secrets \
              --config "$config" \
              --no-file --format env \
              > "$env_tmp"
            test -s "$env_tmp"
            install -m 600 "$env_tmp" "$path/.env"
          done

          # Source host .env to populate process environment with valid secrets
          set -a
          source .env
          set +a

          # Enforce minimum length >= 32 for SEARCH_INTERNAL_API_TOKEN and ETL_ADMIN_KEY
          for var in SEARCH_INTERNAL_API_TOKEN ETL_ADMIN_KEY; do
            val="$(printenv "$var" 2> /dev/null || true)"
            if [[ -z "$val" || "${#val}" -lt 32 ]]; then
              new_val=$(openssl rand -hex 20 2>/dev/null || tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 40)
              export "${var}=${new_val}"
            fi
          done

          # Clean up any stale or short secrets across all .env files
          for var in REDIS_PASSWORD RABBITMQ_PASS MONGO_PASS MEILISEARCH_API_KEY SEARCH_INTERNAL_API_TOKEN ETL_ADMIN_KEY; do
            val="$(printenv "$var" 2> /dev/null || true)"
            if [[ -n "$val" ]]; then
              sed -i "/^${var}=/d" .env 2>/dev/null || true
              echo "${var}=${val}" >> .env
              sed -i "/^${var}=/d" infra/.env 2>/dev/null || true
              echo "${var}=${val}" >> infra/.env

              for f in services/*/.env; do
                if [[ -f "$f" ]]; then
                  sed -i "/^${var}=/d" "$f" 2>/dev/null || true
                  echo "${var}=${val}" >> "$f"
                fi
              done
            fi
          done

          # Combine service .env files
          cat services/*/.env >> infra/.env
          cat services/*/.env >> .env

          # Ensure sanitized secrets take final precedence at the end of .env & infra/.env
          for var in REDIS_PASSWORD RABBITMQ_PASS MONGO_PASS MEILISEARCH_API_KEY SEARCH_INTERNAL_API_TOKEN ETL_ADMIN_KEY; do
            val="$(printenv "$var" 2> /dev/null || true)"
            if [[ -n "$val" ]]; then
              sed -i "/^${var}=/d" .env 2>/dev/null || true
              echo "${var}=${val}" >> .env
              sed -i "/^${var}=/d" infra/.env 2>/dev/null || true
              echo "${var}=${val}" >> infra/.env
            fi
          done

          set -a
          source .env
          set +a

          export IMAGE_TAG=develop
          compose=(docker compose --env-file .env -f infra/docker-compose.yml)

          if ! [[ "$deploy_wait_timeout" =~ ^[1-9][0-9]*$ && "$min_free_mb" =~ ^[1-9][0-9]*$ ]]; then
            echo "❌ Deploy timeout and minimum free disk space must be positive integers"
            exit 1
          fi

          docker_root="$(timeout --signal=TERM --kill-after=5s 15s \
            docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          [ -n "$docker_root" ] && [ -e "$docker_root" ] || docker_root=/

          check_free_space() {
            local available_mb
            available_mb="$(df -Pk "$docker_root" | awk 'NR == 2 { print int($4 / 1024) }')"
            if ! [[ "$available_mb" =~ ^[0-9]+$ ]]; then
              echo "❌ Unable to determine free space for $docker_root"
              return 1
            fi
            echo "💽 Free space on $docker_root: ${available_mb} MB"
            if (( available_mb < min_free_mb )); then
              echo "❌ At least ${min_free_mb} MB is required before starting MongoDB"
              return 1
            fi
          }

          echo "=== Authenticating Docker registry ==="
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset DOPPLER_TOKEN GHCR_TOKEN

          "${compose[@]}" config --quiet

          echo "=== Docker disk usage before cleanup ==="
          df -h "$docker_root" || true
          timeout --signal=TERM --kill-after=10s 30s docker system df || true

          # Never truncate active json-file logs: Docker keeps the old write offset,
          # which can create huge sparse logs and make `docker compose logs` hang.
          timeout --signal=TERM --kill-after=10s 60s docker container prune -f || true
          timeout --signal=TERM --kill-after=10s 120s docker image prune -af || true
          timeout --signal=TERM --kill-after=10s 120s docker builder prune -af || true

          echo "=== Docker disk usage after cleanup ==="
          df -h "$docker_root" || true
          check_free_space

          timeout --signal=TERM --kill-after=30s 300s "${compose[@]}" pull --quiet
          check_free_space

          if ! timeout --signal=TERM --kill-after=30s "$((deploy_wait_timeout + 30))s" \
            "${compose[@]}" up -d --remove-orphans --wait --wait-timeout "$deploy_wait_timeout"; then
            timeout --signal=TERM --kill-after=5s 20s "${compose[@]}" ps --all || true
            if ! timeout --signal=TERM --kill-after=5s 30s \
              "${compose[@]}" logs --no-color --since=10m --tail=60; then
              echo "⚠️ Container log collection timed out; failing deploy without blocking the runner"
            fi
            df -h "$docker_root" || true
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 120s docker image prune -af

          echo "✅ Deploy completed at $(date)"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" \
            "${HETZNER_SSH_USER}@${HETZNER_HOST}" \
            'IFS= read -r DOPPLER_TOKEN &&
             IFS= read -r GHCR_TOKEN &&
             IFS= read -r GHCR_USER &&
             export DOPPLER_TOKEN GHCR_TOKEN GHCR_USER &&
             exec bash --noprofile --norc -se'

  # ═══════════════════════════════════════════
  #  STAGE 6 — AGGREGATE STATUS
  # ═══════════════════════════════════════════
  ci-status:
    name: ✅ CI Status
    needs:
      - detect
      - security
      - python-quality
      - python-test
      - node-ci
      - go-ci
      - rust-ci
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          if [[ "${{ needs.detect.outputs.has_ci_changes }}" != "true" ]]; then
            echo "✅ No microservice, frontend, or deploy infra changes detected; heavy CI jobs were skipped."
            exit 0
          fi

          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs did not pass"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
