name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- STAGE 1: ANALYSIS ---
  analyze:
    name: Analyze Workspace
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.check_python.outputs.exists }}
      has_go: ${{ steps.check_go.outputs.exists }}
      has_rust: ${{ steps.check_rust.outputs.exists }}
      has_java: ${{ steps.check_java.outputs.exists }}
      has_docker: ${{ steps.check_docker.outputs.exists }}
      has_terraform: ${{ steps.check_tf.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: echo "has_node=$(if [ -f package.json ]; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_python
        run: echo "exists=$(if [ -f pyproject.toml ] || ls requirements*.txt >/dev/null 2>&1; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_go
        run: echo "exists=$(if [ -f go.mod ]; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_rust
        run: echo "exists=$(if [ -f Cargo.toml ]; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_java
        run: echo "exists=$(if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_docker
        run: echo "exists=$(if ls [dD]ockerfile* >/dev/null 2>&1 || [ -f docker-compose.yml ]; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

      - id: check_tf
        run: echo "exists=$(if ls *.tf >/dev/null 2>&1; then echo true; else echo false; fi)" >> $GITHUB_OUTPUT

  # --- STAGE 2: SECURITY ---
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks@v8.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --no-git --verbose
        continue-on-error: true

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: 1

  # --- STAGE 3: LANGUAGE SPECIFIC CI ---
  node-ci:
    needs: analyze
    if: needs.analyze.outputs.has_node == 'true'
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  python-ci:
    needs: analyze
    if: needs.analyze.outputs.has_python == 'true'
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - run: |
          if [ -f pyproject.toml ] || [ -f requirements-dev.txt ]; then
            python -m pip install pytest flake8
            if command -v flake8 >/dev/null 2>&1; then find . -name '*.py' -exec flake8 {} +; fi
            if command -v pytest >/dev/null 2>&1; then pytest; fi
          fi

  go-ci:
    needs: analyze
    if: needs.analyze.outputs.has_go == 'true'
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build ./...

  rust-ci:
    needs: analyze
    if: needs.analyze.outputs.has_rust == 'true'
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  java-ci:
    needs: analyze
    if: needs.analyze.outputs.has_java == 'true'
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Gradle Test
        if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        run: ./gradlew test || gradle test
      - name: Maven Test
        if: hashFiles('pom.xml') != ''
        run: mvn -B test

  docker-ci:
    needs: analyze
    if: needs.analyze.outputs.has_docker == 'true'
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Test Build Dockerfile
        run: |
          for f in $(find . -maxdepth 2 -name "*Dockerfile*"); do
            echo "Checking $f"
            docker buildx build . -f $f --cache-from type=gha --cache-to type=gha,mode=max
          done

  terraform-ci:
    needs: analyze
    if: needs.analyze.outputs.has_terraform == 'true'
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  # --- STAGE 4: COMPLETION ---
  ci-status:
    needs: [security, node-ci, python-ci, go-ci, rust-ci, java-ci, docker-ci, terraform-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Overall Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI Failed"
            exit 1
          else
            echo "CI Passed"
          fi
