name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_SERVICES: >-
    services/auth_service
    services/cart_service
    services/email_worker
    services/gateway
    services/product_service
    services/reviews_service

jobs:
  # ═══════════════════════════════════════════
  #  STAGE 1 — DETECT CHANGED SERVICES
  # ═══════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: self-hosted
    outputs:
      has_python: ${{ steps.langs.outputs.has_python }}
      has_go: ${{ steps.langs.outputs.has_go }}
      has_node: ${{ steps.langs.outputs.has_node }}
      has_docker: ${{ steps.langs.outputs.has_docker }}
      services_matrix: ${{ steps.matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect languages
        id: langs
        run: |
          has() { find . -name "$1" -not -path '*/node_modules/*' -not -path '*/.venv/*' | grep -q .; }
          echo "has_python=$(has 'pyproject.toml' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_go=$(has 'go.mod' && echo true || echo false)"             >> $GITHUB_OUTPUT
          echo "has_node=$(has 'package.json' && echo true || echo false)"     >> $GITHUB_OUTPUT
          echo "has_docker=$(has 'Dockerfile' && echo true || echo false)"     >> $GITHUB_OUTPUT

      - name: Build services matrix
        id: matrix
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          result="[]"
          for d in services/*/; do
            name=$(basename "$d")
            [ ! -f "$d/Dockerfile" ] && [ ! -f "$d/DockerFile" ] && continue
            if git diff --name-only "$BASE" HEAD -- "$d" "libs/" "packages/" 2>/dev/null | grep -q .; then
              result=$(echo "$result" | jq --arg n "$name" --arg p "$d" '. += [{"name": $n, "path": $p}]')
            fi
          done
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$result"       >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════
  #  STAGE 2 — SECURITY
  # ═══════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: self-hosted
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-git --verbose --redact \
            --exit-code 0

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
        continue-on-error: true

  # ═══════════════════════════════════════════
  #  STAGE 3 — LINT & TEST (parallel)
  # ═══════════════════════════════════════════

  # ── Python Auto-Format ────────────────────
  python-auto-format:
    name: 🪄 Python Auto-Format
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      # ruff вже встановлений на сервері — не качаємо
      - name: Format all Python services
        run: |
          for srv in ${{ env.PYTHON_SERVICES }}; do
            [ -d "$srv" ] || continue
            ruff check --fix "$srv" || true
            ruff format "$srv"      || true
          done

      - name: Commit auto-format changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format python code"

  # ── Python Quality (один джоб для всіх) ──
  python-quality:
    name: 🔍 Python Quality — ${{ matrix.service.name }}
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: auth_service,    path: services/auth_service    }
          - { name: cart_service,    path: services/cart_service    }
          - { name: email_worker,    path: services/email_worker    }
          - { name: gateway,         path: services/gateway         }
          - { name: product_service, path: services/product_service }
          - { name: reviews_service, path: services/reviews_service }

    steps:
      - uses: actions/checkout@v4

      # ── Кеш uv пакетів на диску сервера ──
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: command -v uv || pip install uv --quiet --break-system-packages

      - name: Install service dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          if   [ -f pyproject.toml ];   then uv pip install --system -q .
          elif [ -f requirements.txt ]; then uv pip install --system -q -r requirements.txt
          fi

      - name: Ruff lint + format check
        working-directory: ${{ matrix.service.path }}
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: mypy type check
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mypy .
        continue-on-error: true

  # ── Python Tests ──────────────────────────
  python-test:
    name: 🧪 Python Tests — ${{ matrix.service.name }}
    needs: [detect, python-quality]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: auth_service,    path: services/auth_service    }
          - { name: cart_service,    path: services/cart_service    }
          - { name: email_worker,    path: services/email_worker    }
          - { name: gateway,         path: services/gateway         }
          - { name: product_service, path: services/product_service }
          - { name: reviews_service, path: services/reviews_service }

    steps:
      - uses: actions/checkout@v4

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: command -v uv || pip install uv --quiet --break-system-packages

      - name: Install service + test dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          if   [ -f pyproject.toml ];   then uv pip install --system -q .
          elif [ -f requirements.txt ]; then uv pip install --system -q -r requirements.txt
          fi
          uv pip install --system -q pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          APP_WORKERS: "1"
          DEBUG: "False"
        run: |
          if find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short
          else
            echo "::warning title=No Tests::No tests found in ${{ matrix.service.path }}/tests/"
          fi

      - name: Upload coverage
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.xml
          if-no-files-found: ignore

  # ── Node.js / React ───────────────────────
  node-ci:
    name: ⚛️ Node.js
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/react/frontend/my-react-app
    steps:
      - uses: actions/checkout@v4

      # ── Кеш node_modules на диску сервера ──
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/react/frontend/my-react-app/node_modules
          key: node-modules-${{ hashFiles('apps/react/frontend/my-react-app/package-lock.json') }}
          restore-keys: node-modules-

      - run: npm install --prefer-offline
      - run: npm run type-check --if-present || true
      - run: npm test --if-present || true
      - run: npm run build --if-present || true

  # ── Go / ETL ──────────────────────────────
  go-ci:
    name: 🐹 Go ETL
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: self-hosted
    env:
      HOME: /root
      GOPATH: /root/go
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        working-directory: services/products_etl
    steps:
      - uses: actions/checkout@v4

      # ── Кеш Go модулів на диску сервера ──
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-${{ hashFiles('services/products_etl/go.sum') }}
          restore-keys: go-

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build ./...

  # ═══════════════════════════════════════════
  #  STAGE 4 — DOCKER BUILD & PUSH → GHCR
  # ═══════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — ${{ matrix.service.name }}
    needs: [detect, security, python-quality, python-test]
    if: |
      always() &&
      !contains(needs.detect.result, 'failure') &&
      !contains(needs.security.result, 'failure') &&
      !contains(needs.python-quality.result, 'failure') &&
      !contains(needs.python-test.result, 'failure') &&
      needs.detect.outputs.has_docker == 'true' &&
      fromJson(needs.detect.outputs.services_matrix || '[]') != fromJson('[]') &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services_matrix || '[]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ── Локальний кеш Docker шарів на диску сервера ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/buildx-cache/${{ matrix.service.name }}-new,mode=max

      # ── Ротація кешу (щоб не росло безкінечно) ──
      - name: Rotate Docker cache
        run: |
          rm -rf /tmp/buildx-cache/${{ matrix.service.name }}
          mv /tmp/buildx-cache/${{ matrix.service.name }}-new \
             /tmp/buildx-cache/${{ matrix.service.name }} 2>/dev/null || true

  # ═══════════════════════════════════════════
  #  STAGE 5 — DEPLOY TO HETZNER
  # ═══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Hetzner
    needs: [docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      !contains(needs.docker-build.result, 'failure') &&
      !contains(needs.docker-build.result, 'cancelled')
    runs-on: self-hosted
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          if ! command -v doppler &> /dev/null; then
            curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
              https://cli.doppler.com/install.sh | sh
          fi
          doppler --version

      - name: Pull secrets from Doppler → .env files
        run: |
          declare -A configs=(
            ["services/gateway"]="dev_gateway"
            ["services/auth_service"]="dev_auth_service"
            ["services/product_service"]="dev_product_service"
            ["services/cart_service"]="dev_cart_service"
            ["services/email_worker"]="dev_email_worker"
            ["services/reviews_service"]="dev_reviews_service"
            ["services/products_etl"]="dev_products_etl"
          )
          for path in "${!configs[@]}"; do
            config="${configs[$path]}"
            echo "⬇️  $config → $path/.env"
            doppler secrets download \
              --project smarket \
              --config "$config" \
              --token "$DOPPLER_TOKEN" \
              --no-file --format env \
              > "$path/.env"
          done
          echo "✅ All .env files generated"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest images & restart services
        working-directory: /app/smarket
        run: |
          git checkout develop
          git pull origin develop

          for srv in services/gateway services/auth_service services/product_service \
                     services/cart_service services/email_worker services/reviews_service \
                     services/products_etl; do
            cp "${{ github.workspace }}/$srv/.env" "$srv/.env" 2>/dev/null || true
          done

          docker compose -f docker-compose.develop.yml pull
          docker compose -f docker-compose.develop.yml up -d --remove-orphans
          docker image prune -f

          echo "✅ Deploy completed at $(date)"

  # ═══════════════════════════════════════════
  #  STAGE 6 — AGGREGATE STATUS
  # ═══════════════════════════════════════════
  ci-status:
    name: ✅ CI Status
    needs:
      - detect
      - security
      - python-auto-format
      - python-quality
      - python-test
      - node-ci
      - go-ci
    if: always()
    runs-on: self-hosted
    steps:
      - name: Check all results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs did not pass"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
