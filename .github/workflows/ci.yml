name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_SERVICES: >-
    services/auth_service
    services/cart_service
    services/email_worker
    services/gateway
    services/product_service
    services/reviews_service
    services/audit_service
  UV_BIN: /root/.local/bin/uv

jobs:
  # ═══════════════════════════════════════════
  #  STAGE 1 — DETECT CHANGED SERVICES
  # ═══════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.changes.outputs.has_python }}
      has_go: ${{ steps.changes.outputs.has_go }}
      has_rust: ${{ steps.changes.outputs.has_rust }}
      has_node: ${{ steps.changes.outputs.has_node }}
      has_docker: ${{ steps.changes.outputs.has_docker }}
      has_ci_changes: ${{ steps.changes.outputs.has_ci_changes }}
      has_deploy_changes: ${{ steps.changes.outputs.has_deploy_changes }}
      services_matrix: ${{ steps.changes.outputs.services_matrix }}
      python_services_matrix: ${{ steps.changes.outputs.python_services_matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"
          if [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="HEAD~1"
          fi

          run_all=false
          if git cat-file -e "${base_sha}^{commit}" 2>/dev/null && git diff --name-only "$base_sha" HEAD > /tmp/smarket-changed-files; then
            echo "Diff base: $base_sha"
          else
            run_all=true
            git ls-files > /tmp/smarket-changed-files
            echo "Diff base is unavailable; running all service checks."
          fi

          echo "Changed files:"
          awk 'NR <= 200 { print "  - " $0 } NR == 201 { print "  - ..."; exit }' /tmp/smarket-changed-files

          changed() {
            local pattern="$1"
            [[ "$run_all" == "true" ]] && return 0
            grep -E "$pattern" /tmp/smarket-changed-files >/dev/null
          }

          docker_services="[]"
          python_services="[]"

          add_docker_service() {
            local name="$1"
            local dockerfile="$2"
            local context="$3"
            if jq -e --arg n "$name" 'any(.[]; .name == $n)' <<< "$docker_services" >/dev/null; then
              return 0
            fi
            docker_services=$(jq -c \
              --arg n "$name" \
              --arg p "services/$name" \
              --arg df "$dockerfile" \
              --arg ctx "$context" \
              '. += [{"name": $n, "path": $p, "dockerfile": $df, "context": $ctx}]' \
              <<< "$docker_services")
          }

          add_python_service() {
            local name="$1"
            python_services=$(jq -c \
              --arg n "$name" \
              --arg p "services/$name" \
              '. += [{"name": $n, "path": $p}]' \
              <<< "$python_services")
          }

          shared_python=false
          if changed '^(libs|packages)/|^(pyproject\.toml|uv\.lock|requirements.*\.txt|\.python-version)$'; then
            shared_python=true
          fi

          root_docker=false
          if changed '^\.dockerignore$'; then
            root_docker=true
          fi

          deploy_infra=false
          if changed '^infra/|^docker-compose\.yml$|^doppler\.yaml$'; then
            deploy_infra=true
          fi

          python_service_changed() {
            local name="$1"
            [[ "$shared_python" == "true" ]] || changed "^services/${name}/"
          }

          if python_service_changed "auth_service"; then
            add_python_service "auth_service"
            add_docker_service "auth_service" "services/auth_service/Dockerfile" "."
          fi

          if python_service_changed "cart_service"; then
            add_python_service "cart_service"
            add_docker_service "cart_service" "services/cart_service/DockerFile" "."
          fi

          if python_service_changed "email_worker"; then
            add_python_service "email_worker"
            add_docker_service "email_worker" "services/email_worker/Dockerfile" "services/email_worker"
          fi

          if python_service_changed "gateway"; then
            add_python_service "gateway"
            add_docker_service "gateway" "services/gateway/Dockerfile" "services/gateway"
          fi

          if python_service_changed "product_service"; then
            add_python_service "product_service"
            add_docker_service "product_service" "services/product_service/DockerFile" "."
          fi

          if python_service_changed "reviews_service"; then
            add_python_service "reviews_service"
            add_docker_service "reviews_service" "services/reviews_service/Dockerfile" "."
          fi

          if python_service_changed "audit_service"; then
            add_python_service "audit_service"
            add_docker_service "audit_service" "services/audit_service/Dockerfile" "."
          fi

          if python_service_changed "zephyros_agent"; then
            add_python_service "zephyros_agent"
            add_docker_service "zephyros_agent" "services/zephyros_agent/Dockerfile" "."
          fi

          if [[ "$root_docker" == "true" ]]; then
            add_docker_service "auth_service" "services/auth_service/Dockerfile" "."
            add_docker_service "cart_service" "services/cart_service/DockerFile" "."
            add_docker_service "product_service" "services/product_service/DockerFile" "."
            add_docker_service "reviews_service" "services/reviews_service/Dockerfile" "."
            add_docker_service "audit_service" "services/audit_service/Dockerfile" "."
            add_docker_service "zephyros_agent" "services/zephyros_agent/Dockerfile" "."
          fi

          has_go=false
          if changed '^services/products_etl/'; then
            has_go=true
            add_docker_service "products_etl" "services/products_etl/Dockerfile" "services/products_etl"
          fi

          has_rust=false
          if changed '^services/search_service/'; then
            has_rust=true
            add_docker_service "search_service" "services/search_service/Dockerfile" "services/search_service"
          fi

          has_node=false
          if changed '^apps/(react/frontend/my-react-app|admin)/'; then
            has_node=true
          fi

          workflow_changed=false
          if changed '^\.github/workflows/|^\.pre-commit-config\.yaml$|^scripts/run_service_tests\.py$'; then
            workflow_changed=true
          fi

          has_python=false
          [[ "$python_services" != "[]" ]] && has_python=true

          has_docker=false
          [[ "$docker_services" != "[]" ]] && has_docker=true

          has_ci_changes=false
          if [[ "$has_python" == "true" || "$has_go" == "true" || "$has_rust" == "true" || "$has_node" == "true" || "$has_docker" == "true" || "$deploy_infra" == "true" || "$workflow_changed" == "true" ]]; then
            has_ci_changes=true
          fi

          has_deploy_changes=false
          if [[ "$has_docker" == "true" || "$deploy_infra" == "true" ]]; then
            has_deploy_changes=true
          fi

          {
            echo "has_python=$has_python"
            echo "has_go=$has_go"
            echo "has_rust=$has_rust"
            echo "has_node=$has_node"
            echo "has_docker=$has_docker"
            echo "has_ci_changes=$has_ci_changes"
            echo "has_deploy_changes=$has_deploy_changes"
            echo "services_matrix=$docker_services"
            echo "python_services_matrix=$python_services"
          } >> "$GITHUB_OUTPUT"

          echo "Python services: $python_services"
          echo "Docker services: $docker_services"
          echo "CI changes: $has_ci_changes"
          echo "Deploy changes: $has_deploy_changes"

  # ═══════════════════════════════════════════
  #  STAGE 2 — SECURITY
  # ═══════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_ci_changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --no-git --verbose --redact \
            --exit-code 1

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1

  # ═══════════════════════════════════════════
  #  STAGE 3 — LINT & TEST (parallel)
  # ═══════════════════════════════════════════

  # ── Python Quality (один джоб для всіх) ──
  python-quality:
    name: 🔍 Python Quality — ${{ matrix.service.name }}
    needs: detect
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      # ── Кеш uv пакетів на диску сервера ──
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path), format('{0}/requirements.txt', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q ruff mypy

      - name: Ruff — style warnings (PEP8, E/W + non-breaking F rules)
        working-directory: ${{ matrix.service.path }}
        continue-on-error: true
        run: |
          .venv/bin/ruff check . --select E,W,F401,F841 --output-format=github
          .venv/bin/ruff format --check . || true

      - name: Ruff — code errors (F rules that break runtime)
        working-directory: ${{ matrix.service.path }}
        run: |
          .venv/bin/ruff check . --select F --ignore F401,F841 --output-format=github

      - name: mypy type check
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/mypy .
        continue-on-error: true

  # ── Python Tests ──────────────────────────
  python-test:
    name: 🧪 Python Tests — ${{ matrix.service.name }}
    needs: [detect, python-quality]
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path), format('{0}/requirements.txt', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service + test dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          JWT_SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          ETL_ADMIN_KEY: "dummy-etl-admin-key-for-tests-123456"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672//"
          RESEND_API_KEY: "dummy-resend-api-key"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          APP_WORKERS: "1"
          DEBUG: "False"

        run: |
          if find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            .venv/bin/pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short
          else
            echo "::warning title=No Tests::No tests found in ${{ matrix.service.path }}/tests/"
          fi

      - name: Upload coverage
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.xml
          if-no-files-found: ignore

  # ── Node.js / React ───────────────────────
  node-ci:
    name: ⚛️ Node.js — ${{ matrix.app.name }}
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: storefront
            path: apps/react/frontend/my-react-app
          - name: admin
            path: apps/admin
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - uses: actions/checkout@v4

      # ── Кеш node_modules на диску сервера ──
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app.path }}/node_modules
          key: node-modules-${{ matrix.app.name }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app.path)) }}
          restore-keys: node-modules-${{ matrix.app.name }}-

      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Contract tests
        run: npm run test:ai --if-present
      - name: Production build
        run: npm run build

  # ── Go / ETL ──────────────────────────────
  go-ci:
    name: 🐹 Go ETL
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/products_etl
    steps:
      - uses: actions/checkout@v4

      # ── Кеш Go модулів на диску сервера ──
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('services/products_etl/go.sum') }}
          restore-keys: go-

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build ./...

  # ── Rust / Search Service ─────────────────
  rust-ci:
    name: 🦀 Rust Search Service
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: services/search_service
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            services/search_service/target
          key: rust-${{ hashFiles('services/search_service/Cargo.lock') }}
          restore-keys: rust-

      - name: Ensure Rustup and Cargo are available
        run: |
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          rustc --version
          cargo --version

      - name: Cargo clippy check
        run: cargo clippy -- -D warnings || cargo clippy

      - name: Run Cargo tests
        run: cargo test --verbose

  # ═══════════════════════════════════════════
  #  STAGE 4 — DOCKER BUILD & PUSH → GHCR
  # ═══════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — ${{ matrix.service.name }}
    needs: [detect, security, python-quality, python-test, node-ci, go-ci, rust-ci]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.detect.outputs.has_docker == 'true' &&
      needs.detect.outputs.services_matrix != '[]' &&
      needs.detect.outputs.services_matrix != '' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services_matrix || '[]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ── Локальний кеш Docker шарів на диску сервера ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/var/tmp/buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/var/tmp/buildx-cache/${{ matrix.service.name }}-new,mode=max

      # ── Ротація кешу (щоб не росло безкінечно) ──
      - name: Rotate Docker cache
        run: |
          rm -rf /var/tmp/buildx-cache/${{ matrix.service.name }}
          mv /var/tmp/buildx-cache/${{ matrix.service.name }}-new \
             /var/tmp/buildx-cache/${{ matrix.service.name }} 2>/dev/null || true

  # ═══════════════════════════════════════════
  #  STAGE 5 — DEPLOY TO HETZNER
  # ═══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Hetzner
    needs: [detect, security, python-quality, python-test, node-ci, go-ci, rust-ci, docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      HOME: /root
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      SMARKET_DEPLOY_WAIT_TIMEOUT: "360"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        run: |
          if ! command -v doppler &> /dev/null; then
            curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
              https://cli.doppler.com/install.sh | sh
          fi
          doppler --version

      - name: Doppler Diagnostics
        run: |
          echo "=== Doppler Token Check ==="
          if [[ "$DOPPLER_TOKEN" == dp.st.* ]]; then
            echo "⚠️ WARNING: You are using a Doppler Service Token (starts with 'dp.st.')."
            echo "Service Tokens are restricted to a single configuration and cannot fetch secrets for other configs."
            echo "Please use a Personal Access Token (starts with 'dp.pt.') for multi-service builds."
          elif [[ "$DOPPLER_TOKEN" == dp.pt.* ]]; then
            echo "✅ Token type: Personal Access Token (dp.pt.)."
          else
            echo "Token prefix: ${DOPPLER_TOKEN:0:7}..."
          fi
          echo "Running 'doppler me' to verify token details:"
          doppler me --token "$DOPPLER_TOKEN" || true
          echo "Running 'doppler projects' to list accessible projects:"
          doppler projects --token "$DOPPLER_TOKEN" || true

      - name: Pull secrets from Doppler → .env files
        run: |
          declare -A configs=(
            ["services/gateway"]="dev_gateway"
            ["services/auth_service"]="dev_auth_service"
            ["services/product_service"]="dev_product_service"
            ["services/cart_service"]="dev_cart_service"
            ["services/email_worker"]="dev_email_worker"
            ["services/reviews_service"]="dev_reviews_service"
            ["services/products_etl"]="dev_products_etl"
            ["services/search_service"]="dev_search_service"
            ["services/zephyros_agent"]="dev_zephyros_agent"
            ["services/audit_service"]="dev_audit_service"
          )
          for path in "${!configs[@]}"; do
            config="${configs[$path]}"
            echo "⬇️  $config → $path/.env"
            doppler secrets download \
              --project smarket-services-secrets \
              --config "$config" \
              --token "$DOPPLER_TOKEN" \
              --no-file --format env \
              > "$path/.env"
          done
          echo "✅ All .env files generated"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest images & restart services
        working-directory: /app/smarket
        run: |
          git config --global --add safe.directory "${{ github.workspace }}" || true
          git config --global --add safe.directory /app/smarket || true
          if [ -f .git/shallow ]; then
            echo "Target repository is shallow. Unshallowing..."
            git fetch --unshallow "${{ github.workspace }}" HEAD
          else
            git fetch "${{ github.workspace }}" HEAD
          fi
          # Preserve host existing infra env files before checkout refresh
          [ -f infra/.env ] && cp infra/.env /tmp/smarket_infra_host.env 2>/dev/null || true
          [ -f .env ] && cp .env /tmp/smarket_root_host.env 2>/dev/null || true

          git checkout -f -B develop FETCH_HEAD

          for srv in services/gateway services/auth_service services/product_service \
                     services/cart_service services/email_worker services/reviews_service \
                     services/products_etl services/search_service services/zephyros_agent \
                     services/audit_service; do
            cp "${{ github.workspace }}/$srv/.env" "$srv/.env" 2>/dev/null || true
          done

          # Restore base host infra envs if present
          if [ -f /tmp/smarket_infra_host.env ]; then
            cp /tmp/smarket_infra_host.env infra/.env
          else
            touch infra/.env
          fi
          if [ -f /tmp/smarket_root_host.env ]; then
            cp /tmp/smarket_root_host.env .env
          else
            touch .env
          fi

          # Source host .env to populate process environment with valid secrets
          set -a
          [ -f .env ] && source .env
          set +a

          # Sanitize service .env files and propagate host secrets
          for var in REDIS_PASSWORD RABBITMQ_PASS MONGO_PASS MEILISEARCH_API_KEY SEARCH_INTERNAL_API_TOKEN ETL_ADMIN_KEY; do
            val="${!var}"
            if [ -n "$val" ]; then
              for f in "${{ github.workspace }}"/services/*/.env services/*/.env; do
                if [ -f "$f" ]; then
                  sed -i "/^${var}=/d" "$f" 2>/dev/null || true
                  echo "${var}=${val}" >> "$f"
                fi
              done
            fi
          done

          # Combine service .env files
          cat "${{ github.workspace }}"/services/*/.env >> infra/.env 2>/dev/null || true
          cat "${{ github.workspace }}"/services/*/.env >> .env 2>/dev/null || true

          # Ensure host secrets take final precedence at the end of .env & infra/.env
          for var in REDIS_PASSWORD RABBITMQ_PASS MONGO_PASS MEILISEARCH_API_KEY SEARCH_INTERNAL_API_TOKEN ETL_ADMIN_KEY; do
            val="${!var}"
            if [ -n "$val" ]; then
              sed -i "/^${var}=/d" .env 2>/dev/null || true
              echo "${var}=${val}" >> .env
              sed -i "/^${var}=/d" infra/.env 2>/dev/null || true
              echo "${var}=${val}" >> infra/.env
            fi
          done

          set -a
          [ -f .env ] && source .env
          set +a

          export IMAGE_TAG=develop
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet
          docker compose --env-file .env -f infra/docker-compose.yml pull --quiet

          if ! docker compose --env-file .env -f infra/docker-compose.yml up -d --remove-orphans --wait --wait-timeout "${SMARKET_DEPLOY_WAIT_TIMEOUT:-240}"; then
            docker compose --env-file .env -f infra/docker-compose.yml ps
            docker compose --env-file .env -f infra/docker-compose.yml logs --tail=150 mongodb rabbitmq redis products_etl auth_service auth_migration_job cart_service cart_migration_job product_service product_migration_job reviews_service reviews_migration_job gateway_service email_worker search_service meilisearch zephyros_agent audit_service audit_migration_job
            exit 1
          fi
          docker image prune -f

          echo "✅ Deploy completed at $(date)"

  # ═══════════════════════════════════════════
  #  STAGE 6 — AGGREGATE STATUS
  # ═══════════════════════════════════════════
  ci-status:
    name: ✅ CI Status
    needs:
      - detect
      - security
      - python-quality
      - python-test
      - node-ci
      - go-ci
      - rust-ci
      - docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          if [[ "${{ needs.detect.outputs.has_ci_changes }}" != "true" ]]; then
            echo "✅ No microservice, frontend, or deploy infra changes detected; heavy CI jobs were skipped."
            exit 0
          fi

          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs did not pass"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
