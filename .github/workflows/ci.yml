name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_SERVICES: >-
    services/auth_service
    services/cart_service
    services/email_worker
    services/gateway
    services/product_service
    services/reviews_service
  UV_BIN: /root/.local/bin/uv

jobs:
  # ═══════════════════════════════════════════
  #  STAGE 1 — DETECT CHANGED SERVICES
  # ═══════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: self-hosted
    outputs:
      has_python: 'true'
      has_go: 'true'
      has_node: 'true'
      has_docker: 'true'
      services_matrix: '[{"name": "auth_service", "path": "services/auth_service", "dockerfile": "services/auth_service/Dockerfile"}, {"name": "cart_service", "path": "services/cart_service", "dockerfile": "services/cart_service/DockerFile"}, {"name": "email_worker", "path": "services/email_worker", "dockerfile": "services/email_worker/Dockerfile"}, {"name": "gateway", "path": "services/gateway", "dockerfile": "services/gateway/Dockerfile"}, {"name": "product_service", "path": "services/product_service", "dockerfile": "services/product_service/DockerFile"}, {"name": "reviews_service", "path": "services/reviews_service", "dockerfile": "services/reviews_service/Dockerfile"}, {"name": "products_etl", "path": "services/products_etl", "dockerfile": "services/products_etl/Dockerfile"}]'
      python_services_matrix: '[{"name": "auth_service", "path": "services/auth_service"}, {"name": "cart_service", "path": "services/cart_service"}, {"name": "email_worker", "path": "services/email_worker"}, {"name": "gateway", "path": "services/gateway"}, {"name": "product_service", "path": "services/product_service"}, {"name": "reviews_service", "path": "services/reviews_service"}]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect languages
        id: langs
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          
          # Fallback check
          git diff --name-only "$BASE" HEAD &>/dev/null
          if [ $? -ne 0 ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "has_go=true"     >> $GITHUB_OUTPUT
            echo "has_node=true"   >> $GITHUB_OUTPUT
            echo "has_docker=true" >> $GITHUB_OUTPUT
          else
            has_python="false"
            if git diff --name-only "$BASE" HEAD -- "services/" "libs/" "packages/" 2>/dev/null | grep -E 'pyproject\.toml$|\.py$' &>/dev/null; then
              has_python="true"
            fi
            
            has_go="false"
            if git diff --name-only "$BASE" HEAD -- "services/products_etl" 2>/dev/null | grep -q .; then
              has_go="true"
            fi
            
            has_node="false"
            if git diff --name-only "$BASE" HEAD -- "apps/react/frontend/my-react-app" 2>/dev/null | grep -q .; then
              has_node="true"
            fi
            
            has_docker="false"
            if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -i "Dockerfile" &>/dev/null; then
              has_docker="true"
            fi
            
            echo "has_python=$has_python" >> $GITHUB_OUTPUT
            echo "has_go=$has_go"         >> $GITHUB_OUTPUT
            echo "has_node=$has_node"     >> $GITHUB_OUTPUT
            echo "has_docker=$has_docker" >> $GITHUB_OUTPUT
          fi

      - name: Build services matrix
        id: matrix
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          result="[]"
          
          git diff --name-only "$BASE" HEAD &>/dev/null
          if [ $? -ne 0 ]; then
            # fallback: all services with Dockerfile
            for d in services/*/; do
              name=$(basename "$d")
              [ ! -f "${d}Dockerfile" ] && [ ! -f "${d}DockerFile" ] && continue
              df="${d}Dockerfile"
              [ ! -f "$df" ] && df="${d}DockerFile"
              result=$(echo "$result" | jq --arg n "$name" --arg p "$d" --arg df "$df" '. += [{"name": $n, "path": $p, "dockerfile": $df}]')
            done
          else
            for d in services/*/; do
              name=$(basename "$d")
              [ ! -f "${d}Dockerfile" ] && [ ! -f "${d}DockerFile" ] && continue
              df="${d}Dockerfile"
              [ ! -f "$df" ] && df="${d}DockerFile"
              if git diff --name-only "$BASE" HEAD -- "$d" "libs/" "packages/" 2>/dev/null | grep -q .; then
                result=$(echo "$result" | jq --arg n "$name" --arg p "$d" --arg df "$df" '. += [{"name": $n, "path": $p, "dockerfile": $df}]')
              fi
            done
          fi
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$result"       >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

      - name: Build python services matrix
        id: py-matrix
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          result="[]"
          
          git diff --name-only "$BASE" HEAD &>/dev/null
          if [ $? -ne 0 ]; then
            # fallback: all services
            result='[
              {"name": "auth_service", "path": "services/auth_service"},
              {"name": "cart_service", "path": "services/cart_service"},
              {"name": "email_worker", "path": "services/email_worker"},
              {"name": "gateway", "path": "services/gateway"},
              {"name": "product_service", "path": "services/product_service"},
              {"name": "reviews_service", "path": "services/reviews_service"}
            ]'
          else
            # check if libs or packages or global config changed -> if so, run all services
            if git diff --name-only "$BASE" HEAD -- "libs/" "packages/" 2>/dev/null | grep -q .; then
              result='[
                {"name": "auth_service", "path": "services/auth_service"},
                {"name": "cart_service", "path": "services/cart_service"},
                {"name": "email_worker", "path": "services/email_worker"},
                {"name": "gateway", "path": "services/gateway"},
                {"name": "product_service", "path": "services/product_service"},
                {"name": "reviews_service", "path": "services/reviews_service"}
              ]'
            else
              for d in services/*/; do
                name=$(basename "$d")
                [ ! -f "$d/pyproject.toml" ] && [ ! -f "$d/requirements.txt" ] && continue
                if git diff --name-only "$BASE" HEAD -- "$d" 2>/dev/null | grep -q .; then
                  result=$(echo "$result" | jq --arg n "$name" --arg p "$d" '. += [{"name": $n, "path": $p}]')
                fi
              done
            fi
          fi
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$result"       >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════
  #  STAGE 2 — SECURITY
  # ═══════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: self-hosted
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-git --verbose --redact \
            --exit-code 0

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
        continue-on-error: true

  # ═══════════════════════════════════════════
  #  STAGE 3 — LINT & TEST (parallel)
  # ═══════════════════════════════════════════

  # ── Setup Python 3.11 ──────────────────────
  setup-python:
    name: 🐍 Setup Python 3.11
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: self-hosted
    steps:
      - name: Install Python 3.11 via deadsnakes PPA
        run: |
          if ! command -v python3.11 &> /dev/null; then
            echo "Installing Python 3.11..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository ppa:deadsnakes/ppa -y
            apt-get update
            apt-get install -y python3.11 python3.11-venv python3.11-dev
          else
            echo "Python 3.11 is already installed"
          fi

  # ── Python Quality (один джоб для всіх) ──
  python-quality:
    name: 🔍 Python Quality — ${{ matrix.service.name }}
    needs: [detect, setup-python]
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      # ── Кеш uv пакетів на диску сервера ──
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python python3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q ruff mypy

      - name: Ruff lint + format check
        working-directory: ${{ matrix.service.path }}
        run: |
          .venv/bin/ruff check . --output-format=github
          .venv/bin/ruff format --check .

      - name: mypy type check
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/mypy .
        continue-on-error: true

  # ── Python Tests ──────────────────────────
  python-test:
    name: 🧪 Python Tests — ${{ matrix.service.name }}
    needs: [detect, python-quality]
    if: |
      needs.detect.outputs.has_python == 'true' &&
      needs.detect.outputs.python_services_matrix != '[]' &&
      needs.detect.outputs.python_services_matrix != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.python_services_matrix || '[]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Ensure uv is available
        run: |
          export PATH="/root/.local/bin:$PATH"
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          ln -sf /root/.local/bin/uv /usr/local/bin/uv

      - name: Install service + test dependencies into venv
        working-directory: ${{ matrix.service.path }}
        run: |
          export PATH="/root/.local/bin:$PATH"
          uv venv --python python3.11 .venv
          if   [ -f pyproject.toml ];   then uv pip install --python .venv/bin/python -q .
          elif [ -f requirements.txt ]; then uv pip install --python .venv/bin/python -q -r requirements.txt
          fi
          uv pip install --python .venv/bin/python -q pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          APP_WORKERS: "1"
          DEBUG: "False"
        run: |
          if find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            .venv/bin/pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short
          else
            echo "::warning title=No Tests::No tests found in ${{ matrix.service.path }}/tests/"
          fi

      - name: Upload coverage
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.xml
          if-no-files-found: ignore

  # ── Node.js / React ───────────────────────
  node-ci:
    name: ⚛️ Node.js
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/react/frontend/my-react-app
    steps:
      - uses: actions/checkout@v4

      # ── Кеш node_modules на диску сервера ──
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/react/frontend/my-react-app/node_modules
          key: node-modules-${{ hashFiles('apps/react/frontend/my-react-app/package-lock.json') }}
          restore-keys: node-modules-

      - run: npm install --prefer-offline
      - run: npm run type-check --if-present || true
      - run: npm test --if-present || true
      - run: npm run build --if-present || true

  # ── Go / ETL ──────────────────────────────
  go-ci:
    name: 🐹 Go ETL
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: self-hosted
    env:
      HOME: /root
      GOPATH: /root/go
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        working-directory: services/products_etl
    steps:
      - uses: actions/checkout@v4

      # ── Кеш Go модулів на диску сервера ──
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: go-${{ hashFiles('services/products_etl/go.sum') }}
          restore-keys: go-

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build ./...

  # ═══════════════════════════════════════════
  #  STAGE 4 — DOCKER BUILD & PUSH → GHCR
  # ═══════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — ${{ matrix.service.name }}
    needs: [detect, security, python-quality, python-test]
    if: |
      always() &&
      !contains(needs.detect.result, 'failure') &&
      !contains(needs.security.result, 'failure') &&
      !contains(needs.python-quality.result, 'failure') &&
      !contains(needs.python-test.result, 'failure') &&
      needs.detect.outputs.has_docker == 'true' &&
      needs.detect.outputs.services_matrix != '[]' &&
      needs.detect.outputs.services_matrix != '' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services_matrix || '[]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # ── Локальний кеш Docker шарів на диску сервера ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/buildx-cache/${{ matrix.service.name }}-new,mode=max

      # ── Ротація кешу (щоб не росло безкінечно) ──
      - name: Rotate Docker cache
        run: |
          rm -rf /tmp/buildx-cache/${{ matrix.service.name }}
          mv /tmp/buildx-cache/${{ matrix.service.name }}-new \
             /tmp/buildx-cache/${{ matrix.service.name }} 2>/dev/null || true

  # ═══════════════════════════════════════════
  #  STAGE 5 — DEPLOY TO HETZNER
  # ═══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Hetzner
    needs: [detect, security, python-quality, python-test, node-ci, go-ci, docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    env:
      HOME: /root
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          if ! command -v doppler &> /dev/null; then
            curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
              https://cli.doppler.com/install.sh | sh
          fi
          doppler --version

      - name: Doppler Diagnostics
        run: |
          echo "=== Doppler Token Check ==="
          if [[ "$DOPPLER_TOKEN" == dp.st.* ]]; then
            echo "⚠️ WARNING: You are using a Doppler Service Token (starts with 'dp.st.')."
            echo "Service Tokens are restricted to a single configuration and cannot fetch secrets for other configs."
            echo "Please use a Personal Access Token (starts with 'dp.pt.') for multi-service builds."
          elif [[ "$DOPPLER_TOKEN" == dp.pt.* ]]; then
            echo "✅ Token type: Personal Access Token (dp.pt.)."
          else
            echo "Token prefix: ${DOPPLER_TOKEN:0:7}..."
          fi
          echo "Running 'doppler me' to verify token details:"
          doppler me --token "$DOPPLER_TOKEN" || true
          echo "Running 'doppler projects' to list accessible projects:"
          doppler projects --token "$DOPPLER_TOKEN" || true

      - name: Pull secrets from Doppler → .env files
        run: |
          declare -A configs=(
            ["services/gateway"]="dev_gateway"
            ["services/auth_service"]="dev_auth_service"
            ["services/product_service"]="dev_product_service"
            ["services/cart_service"]="dev_cart_service"
            ["services/email_worker"]="dev_email_worker"
            ["services/reviews_service"]="dev_reviews_service"
            ["services/products_etl"]="dev_products_etl"
          )
          for path in "${!configs[@]}"; do
            config="${configs[$path]}"
            echo "⬇️  $config → $path/.env"
            doppler secrets download \
              --project smarket-services-secrets \
              --config "$config" \
              --token "$DOPPLER_TOKEN" \
              --no-file --format env \
              > "$path/.env"
          done
          echo "✅ All .env files generated"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest images & restart services
        working-directory: /app/smarket
        run: |
          git checkout develop
          git pull origin develop

          for srv in services/gateway services/auth_service services/product_service \
                     services/cart_service services/email_worker services/reviews_service \
                     services/products_etl; do
            cp "${{ github.workspace }}/$srv/.env" "$srv/.env" 2>/dev/null || true
          done

          export IMAGE_TAG=develop
          docker compose -f infra/docker-compose.yml pull
          docker compose -f infra/docker-compose.yml up -d --remove-orphans
          docker image prune -f

          echo "✅ Deploy completed at $(date)"

  # ═══════════════════════════════════════════
  #  STAGE 6 — AGGREGATE STATUS
  # ═══════════════════════════════════════════
  ci-status:
    name: ✅ CI Status
    needs:
      - detect
      - security
      - python-quality
      - python-test
      - node-ci
      - go-ci
    if: always()
    runs-on: self-hosted
    steps:
      - name: Check all results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs did not pass"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
