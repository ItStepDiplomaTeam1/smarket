name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ═══════════════════════════════════════════
  #  STAGE 1 — DETECT CHANGED SERVICES
  # ═══════════════════════════════════════════
  detect:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.langs.outputs.has_python }}
      has_go: ${{ steps.langs.outputs.has_go }}
      has_node: ${{ steps.langs.outputs.has_node }}
      has_docker: ${{ steps.langs.outputs.has_docker }}
      services_matrix: ${{ steps.matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect languages
        id: langs
        run: |
          has() { find . -name "$1" -not -path '*/node_modules/*' -not -path '*/.venv/*' | grep -q .; }
          echo "has_python=$(has 'pyproject.toml' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_go=$(has 'go.mod' && echo true || echo false)"             >> $GITHUB_OUTPUT
          echo "has_node=$(has 'package.json' && echo true || echo false)"     >> $GITHUB_OUTPUT
          echo "has_docker=$(has 'Dockerfile' && echo true || echo false)"     >> $GITHUB_OUTPUT

      - name: Build services matrix
        id: matrix
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          result="[]"
          for d in services/*/; do
            name=$(basename "$d")
            [ ! -f "$d/Dockerfile" ] && [ ! -f "$d/DockerFile" ] && continue
            if git diff --name-only "$BASE" HEAD -- "$d" "libs/" "packages/" 2>/dev/null | grep -q .; then
              result=$(echo "$result" | jq --arg n "$name" --arg p "$d" '. += [{"name": $n, "path": $p}]')
            fi
          done
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$result"       >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════
  #  STAGE 2 — SECURITY
  # ═══════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-git --verbose --redact \
            --exit-code 0

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1
        continue-on-error: true

  # ═══════════════════════════════════════════
  #  STAGE 3 — LINT & TEST (parallel)
  # ═══════════════════════════════════════════

  # ── Python Auto-Format ────────────────────
  python-auto-format:
    name: 🪄 Python Auto-Format
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff --quiet

      - name: Format all Python services
        run: |
          for srv in services/auth_service services/cart_service services/email_worker \
                     services/gateway services/product_service services/reviews_service; do
            [ -d "$srv" ] || continue
            ruff check --fix "$srv" || true
            ruff format "$srv"      || true
          done

      - name: Commit auto-format changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format python code"

  # ── Python Quality ────────────────────────
  python-quality:
    name: 🔍 Python Quality — ${{ matrix.service.name }}
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: auth_service,    path: services/auth_service    }
          - { name: cart_service,    path: services/cart_service    }
          - { name: email_worker,    path: services/email_worker    }
          - { name: gateway,         path: services/gateway         }
          - { name: product_service, path: services/product_service }
          - { name: reviews_service, path: services/reviews_service }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Install uv + lint tools
        run: pip install uv --quiet && uv pip install --system ruff mypy

      - name: Install service dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          if   [ -f pyproject.toml ];  then uv pip install --system .
          elif [ -f requirements.txt ]; then uv pip install --system -r requirements.txt
          fi

      - name: Ruff lint
        working-directory: ${{ matrix.service.path }}
        run: ruff check . --output-format=github

      - name: Ruff format check
        working-directory: ${{ matrix.service.path }}
        run: ruff format --check .

      - name: mypy type check
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mypy .
        continue-on-error: true

  # ── Python Tests ──────────────────────────
  python-test:
    name: 🧪 Python Tests — ${{ matrix.service.name }}
    needs: [detect, python-quality]
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: auth_service,    path: services/auth_service    }
          - { name: cart_service,    path: services/cart_service    }
          - { name: email_worker,    path: services/email_worker    }
          - { name: gateway,         path: services/gateway         }
          - { name: product_service, path: services/product_service }
          - { name: reviews_service, path: services/reviews_service }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.service.name }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.service.path)) }}
          restore-keys: uv-${{ matrix.service.name }}-

      - name: Install uv + dependencies
        run: pip install uv --quiet

      - name: Install service + test dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          if   [ -f pyproject.toml ];  then uv pip install --system .
          elif [ -f requirements.txt ]; then uv pip install --system -r requirements.txt
          fi
          uv pip install --system pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "cafebabe00000000000000000000000000000000000000000000000000000000"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          APP_WORKERS: "1"
          DEBUG: "False"
        run: |
          if find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short
          else
            echo "::warning title=No Tests::No tests found in ${{ matrix.service.path }}/tests/"
          fi

      - name: Upload coverage
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.xml
          if-no-files-found: ignore

  # ── Node.js / React ───────────────────────
  node-ci:
    name: ⚛️ Node.js
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/react/frontend/my-react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/react/frontend/my-react-app/package-lock.json

      - run: npm ci
      - run: npm run type-check --if-present || true
      - run: npm test --if-present || true
      - run: npm run build --if-present || true

  # ── Go / ETL ──────────────────────────────
  go-ci:
    name: 🐹 Go ETL
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/products_etl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/products_etl/go.mod
          cache: true
          cache-dependency-path: services/products_etl/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go build ./...

  # ═══════════════════════════════════════════
  #  STAGE 4 — DOCKER BUILD & PUSH → GHCR
  # ═══════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — ${{ matrix.service.name }}
    needs: [detect, security, python-quality, python-test]
    if: |
      always() &&
      !contains(needs.detect.result, 'failure') &&
      !contains(needs.security.result, 'failure') &&
      !contains(needs.python-quality.result, 'failure') &&
      !contains(needs.python-test.result, 'failure') &&
      needs.detect.outputs.has_docker == 'true' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services_matrix || '[]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ═══════════════════════════════════════════
  #  STAGE 5 — DEPLOY TO HETZNER VIA SSH
  # ═══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Hetzner
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /app/smarket

            git checkout develop
            git pull origin develop

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.develop.yml pull
            docker compose -f docker-compose.develop.yml up -d --remove-orphans

            docker image prune -f

            echo "✅ Deploy completed at $(date)"

  # ═══════════════════════════════════════════
  #  STAGE 6 — AGGREGATE STATUS
  # ═══════════════════════════════════════════
  ci-status:
    name: ✅ CI Status
    needs:
      - detect
      - security
      - python-auto-format
      - python-quality
      - python-test
      - node-ci
      - go-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs did not pass"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
