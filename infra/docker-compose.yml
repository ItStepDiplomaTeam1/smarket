services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../services/api/.env

  auth_service:
    build:
      context: ..
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ../services/auth_service/.env
