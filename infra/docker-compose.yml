x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${SMARKET_LOG_MAX_SIZE:-10m}"
    max-file: "${SMARKET_LOG_MAX_FILES:-2}"

x-healthcheck-defaults: &healthcheck-defaults
  interval: "${SMARKET_HEALTH_INTERVAL:-30s}"
  timeout: "${SMARKET_HEALTH_TIMEOUT:-5s}"
  retries: 5
  start_period: "${SMARKET_HEALTH_START_PERIOD:-20s}"

x-runtime-defaults: &runtime-defaults
  init: true
  restart: on-failure
  networks:
    - smarket-network
  logging: *default-logging

x-api-defaults: &api-defaults
  <<: *runtime-defaults
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 128

x-job-defaults: &job-defaults
  <<: *runtime-defaults
  restart: "no"
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 128

services:
  auth_service:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/auth_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/auth_service/Dockerfile
    command:
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "${SMARKET_AUTH_WORKERS:-1}"
      - services.auth_service.main:app
    expose:
      - "8001"
    env_file:
      - ../services/auth_service/.env
    depends_on:
      redis:
        condition: service_healthy
      auth_migration_job:
        condition: service_completed_successfully

  gateway_service:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/gateway:${IMAGE_TAG:-develop}
    mem_limit: 192m
    cpus: 0.50
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    command:
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "${SMARKET_GATEWAY_WORKERS:-1}"
      - app.main:app
    ports:
      - "8080:8080"
    env_file:
      - ../services/gateway/.env

  auth_migration_job:
    <<: *job-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/auth_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/auth_service/Dockerfile
    command:
      - sh
      - -c
      - cd /app/services/auth_service && alembic upgrade head
    env_file:
      - ../services/auth_service/.env

  cart_migration_job:
    <<: *job-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/cart_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/cart_service/DockerFile
    command:
      - sh
      - -c
      - cd /app/services/cart_service && alembic upgrade head
    env_file:
      - ../services/cart_service/.env

  product_migration_job:
    <<: *job-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/product_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/product_service/DockerFile
    command:
      - sh
      - -c
      - cd /app/services/product_service && alembic upgrade head
    env_file:
      - ../services/product_service/.env

  reviews_migration_job:
    <<: *job-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/reviews_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/reviews_service/Dockerfile
    command:
      - sh
      - -c
      - cd /app/services/reviews_service && alembic upgrade head
    env_file:
      - ../services/reviews_service/.env

  product_service:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/product_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/product_service/DockerFile
    command:
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${SMARKET_PRODUCT_WORKERS:-1}"
      - app.main:app
    expose:
      - "8000"
    env_file:
      - ../services/product_service/.env
    depends_on:
      product_migration_job:
        condition: service_completed_successfully

  cart_service:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/cart_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/cart_service/DockerFile
    command:
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --workers
      - "${SMARKET_CART_WORKERS:-1}"
      - services.cart_service.app.main:app
    expose:
      - "8002"
    env_file:
      - ../services/cart_service/.env
    depends_on:
      cart_migration_job:
        condition: service_completed_successfully

  reviews_service:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/reviews_service:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: services/reviews_service/Dockerfile
    command:
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --workers
      - "${SMARKET_REVIEWS_WORKERS:-1}"
      - app.main:app
    expose:
      - "8004"
    env_file:
      - ../services/reviews_service/.env
    depends_on:
      reviews_migration_job:
        condition: service_completed_successfully

  redis:
    <<: *runtime-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - "${REDIS_MAXMEMORY:-128mb}"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
      start_period: "${REDIS_HEALTH_START_PERIOD:-10s}"
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64

  rabbitmq:
    <<: *runtime-defaults
    image: rabbitmq:3-alpine
    expose:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-smarket}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-secure_rmq_pass_123}"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      timeout: "${RABBITMQ_HEALTH_TIMEOUT:-10s}"
      retries: 10
      start_period: "${RABBITMQ_HEALTH_START_PERIOD:-30s}"
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 256

  mongodb:
    <<: *runtime-defaults
    image: mongo:8.3
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_SIZE_GB:-0.25}"
      - --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASS:-secure_mongo_pass_123}"
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "mongosh --quiet \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin?authSource=admin\" --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      timeout: "${MONGO_HEALTH_TIMEOUT:-10s}"
      start_period: "${MONGO_HEALTH_START_PERIOD:-60s}"
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256

  email_worker:
    <<: *api-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/email_worker:${IMAGE_TAG:-develop}
    build:
      context: ../services/email_worker
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-smarket}:${RABBITMQ_PASS:-secure_rmq_pass_123}@rabbitmq:5672/"
    env_file:
      - ../services/email_worker/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 160m
    cpus: 0.25
    pids_limit: 96

  products_etl:
    <<: *runtime-defaults
    image: ghcr.io/itstepdiplomateam1/smarket/products_etl:${IMAGE_TAG:-develop}
    build:
      context: ../services/products_etl
      dockerfile: Dockerfile
    environment:
      ENV: production
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-smarket}:${RABBITMQ_PASS:-secure_rmq_pass_123}@rabbitmq:5672/"
      MONGO_URI: "mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-secure_mongo_pass_123}@mongodb:27017/"
    env_file:
      - ../services/products_etl/.env
    expose:
      - "8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128

volumes:
  rabbitmq_data:
  mongodb_data:

networks:
  smarket-network:
    driver: bridge
