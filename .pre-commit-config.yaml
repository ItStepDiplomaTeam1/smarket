repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: run-service-tests
        name: Run service unit tests
        entry: python scripts/run_service_tests.py
        language: python
        files: ^services/
        pass_filenames: true
